<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Geometri</title>
    
    <!-- Hasil Kompilasi Tailwind CSS -->
    <link href="assets/css/output.css" rel="stylesheet" />
    
    <!-- Google Fonts & Bootstrap Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  </head>
  <body>

    <!-- HERO SECTION -->
    <header class="bg-linear-to-br from-butter-100 via-butter-200 to-butter-100 text-coffee-900 py-10 px-4 mb-8 border-b border-brand-border text-center shadow-sm">
      <div class="max-w-4xl mx-auto">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-brand-brown text-white rounded-2xl mb-4 shadow-md">
          <i class="bi bi-calculator text-3xl"></i>
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2 text-coffee-900">
          Kalkulator Geometri
        </h1>
        <p class="text-base md:text-lg text-coffee-700 font-medium max-w-xl mx-auto">
          Hitung luas, keliling, dan volume bangun datar & bangun ruang secara presisi dengan tampilan elegan.
        </p>
      </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-5xl mx-auto px-4 pb-16">

      <!-- TAB NAVIGATION -->
      <div class="flex justify-center mb-8">
        <nav class="flex gap-2 p-1.5 bg-butter-200/60 rounded-2xl max-w-md w-full border border-brand-border" role="tablist">
          
          <!-- Tombol Tab Bangun Datar -->
          <button 
            class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl font-semibold text-sm transition-rall duration-200 bg-brand-brown text-white shadow-sm hover:bg-brand-hover active" 
            id="datar-tab" 
            data-bs-toggle="tab" 
            data-bs-target="#datar" 
            type="button" 
            role="tab">
            <i class="bi bi-square text-base"></i>
            <span>Bangun Datar</span>
          </button>

          <!-- Tombol Tab Bangun Ruang -->
          <button 
            class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl font-medium text-sm transition-all duration-200 text-coffee-800 hover:bg-butter-100 hover:text-coffee-900" 
            id="ruang-tab" 
            data-bs-toggle="tab" 
            data-bs-target="#ruang" 
            type="button" 
            role="tab">
            <i class="bi bi-box text-base"></i>
            <span>Bangun Ruang</span>
          </button>

        </nav>
      </div>

      <!-- TAB CONTENT WRAPPER -->
      <div class="tab-content">
        
        <!-- ================= TAB 1: BANGUN DATAR ================= -->
        <div class="tab-pane fade show active space-y-8" id="datar" role="tabpanel">
          
          <!-- 1. Grid Pilih Bangun Datar -->
          <div>
            <h2 class="text-xl font-bold text-coffee-900 mb-4 text-center flex items-center justify-center gap-2">
              <i data-lucide="layout-grid" class="w-5 h-5 text-brand-brown"></i> Pilih Bangun Datar
            </h2>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
              <button type="button" data-shape="persegi" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="square" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Persegi</span>
              </button>

              <button type="button" data-shape="persegi-panjang" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="rectangle-horizontal" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Persegi Panjang</span>
              </button>

              <button type="button" data-shape="segitiga" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="triangle" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Segitiga</span>
              </button>

              <button type="button" data-shape="lingkaran" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="circle" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Lingkaran</span>
              </button>

              <button type="button" data-shape="trapesium" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="pentagon" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Trapesium</span>
              </button>

              <button type="button" data-shape="jajargenjang" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="rectangle-horizontal" class="w-7 h-7 mb-2 text-brand-brown -skew-x-12 group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Jajargenjang</span>
              </button>

              <button type="button" data-shape="belah-ketupat" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="diamond" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Belah Ketupat</span>
              </button>

              <button type="button" data-shape="layang-layang" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="gem" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Layang-Layang</span>
              </button>
            </div>
          </div>

          <!-- 2. Form Input Dinamis Bangun Datar -->
          <div class="hidden bg-white p-6 rounded-2xl border border-brand-border shadow-sm max-w-2xl mx-auto" id="datar-input-card">
            <h3 class="text-lg font-bold text-coffee-900 mb-4 pb-2 border-b border-butter-200 flex items-center gap-2">
              <i data-lucide="pen-tool" class="w-5 h-5 text-brand-brown"></i>
              <span>Input Parameter</span>
            </h3>
            
            <form id="form-datar">
              <div id="datar-inputs" class="space-y-4 mb-6"></div>
              
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <button type="submit" class="w-full bg-brand-brown hover:bg-brand-hover text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-2">
                  <i data-lucide="calculator" class="w-5 h-5"></i> Hitung
                </button>
                <button type="button" id="reset-datar" class="w-full bg-butter-100 hover:bg-butter-200 text-coffee-800 font-medium py-3 px-6 rounded-xl border border-brand-border transition-all duration-200 flex items-center justify-center gap-2">
                  <i data-lucide="rotate-ccw" class="w-5 h-5"></i> Reset
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- ================= TAB 2: BANGUN RUANG ================= -->
        <div class="tab-pane fade space-y-8 hidden" id="ruang" role="tabpanel">
          
          <!-- 1. Grid Pilih Bangun Ruang -->
          <div>
            <h2 class="text-xl font-bold text-coffee-900 mb-4 text-center flex items-center justify-center gap-2">
              <i data-lucide="layout-grid" class="w-5 h-5 text-brand-brown"></i> Pilih Bangun Ruang
            </h2>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
              <button type="button" data-shape="kubus" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="box" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Kubus</span>
              </button>

              <button type="button" data-shape="balok" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="package" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Balok</span>
              </button>

              <button type="button" data-shape="tabung" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="cylinder" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Tabung</span>
              </button>

              <button type="button" data-shape="kerucut" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="cone" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Kerucut</span>
              </button>

              <button type="button" data-shape="bola" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="globe" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Bola</span>
              </button>

              <button type="button" data-shape="prisma-segitiga" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="pyramid" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Prisma Segitiga</span>
              </button>

              <button type="button" data-shape="limas-segiempat" class="shape-card flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-brand-border shadow-sm hover:bg-butter-100 hover:border-brand-brown hover:shadow-md transition-all duration-200 group text-coffee-800">
                <i data-lucide="pyramid" class="w-7 h-7 mb-2 text-brand-brown group-hover:scale-110 transition-transform"></i>
                <span class="font-semibold text-sm">Limas Segiempat</span>
              </button>
            </div>
          </div>

          <!-- 2. Form Input Dinamis Bangun Ruang -->
          <div class="hidden bg-white p-6 rounded-2xl border border-brand-border shadow-sm max-w-2xl mx-auto" id="ruang-input-card">
            <h3 class="text-lg font-bold text-coffee-900 mb-4 pb-2 border-b border-butter-200 flex items-center gap-2">
              <i data-lucide="pen-tool" class="w-5 h-5 text-brand-brown"></i>
              <span>Input Parameter</span>
            </h3>
            
            <form id="form-ruang">
              <div id="ruang-inputs" class="space-y-4 mb-6"></div>
              
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <button type="submit" class="w-full bg-brand-brown hover:bg-brand-hover text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-2">
                  <i data-lucide="calculator" class="w-5 h-5"></i> Hitung
                </button>
                <button type="button" id="reset-ruang" class="w-full bg-butter-100 hover:bg-butter-200 text-coffee-800 font-medium py-3 px-6 rounded-xl border border-brand-border transition-all duration-200 flex items-center justify-center gap-2">
                  <i data-lucide="rotate-ccw" class="w-5 h-5"></i> Reset
                </button>
              </div>
            </form>
          </div>
        </div>

      </div>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
      <div class="container">
        <p class="mb-0">&copy; 2026 Taqiyyah Adha</p>
      </div>
    </footer>

    <!-- Lucide Icons CDN & Inisialisasi -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="assets/js/script.js"></script>
    
  </body>
</html>
